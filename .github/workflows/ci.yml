name: Validate downstream application

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout downstream application
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify downstream policy guardrails
        run: node scripts/verify-policy.mjs

      - name: Checkout pinned engine source
        uses: actions/checkout@v4
        with:
          repository: neophilism/Secure-Intake-Case-Workflow-Engine
          ref: 788de83a9f00e9bb68c470838b4256fc8f932304
          path: .engine

      - name: Install pinned engine dependencies
        working-directory: .engine
        run: npm install

      - name: Validate SIG manifest with pinned engine
        working-directory: .engine
        run: npm run app:manifest -- --file ../application/manifest.json --validate-only

      - name: Validate Compose configuration
        run: docker compose --env-file deployment/.env.example -f deployment/compose.yaml config

      - name: Verify production deployment acceptance template
        run: >-
          node scripts/verify-production-deployment.mjs
          --template
          --env deployment/production.env.example
          --evidence deployment/acceptance-evidence.example.json

      - name: Validate production Compose configuration
        run: >-
          docker compose
          --env-file deployment/production.env.example
          -f deployment/compose.production.yaml
          config

      - name: Generate and validate Render production Blueprint
        run: |
          node -e '
            const fs = require("fs");
            const lock = require("./engine.lock.json").engine;
            const repository = "ghcr.io/neophilism/secure-intake-case-workflow-engine";
            const digest = "sha256:" + "a".repeat(64);
            fs.writeFileSync("/tmp/release-evidence.json", JSON.stringify({
              schemaVersion: 1,
              engine: {
                version: lock.version,
                sourceCommit: lock.sourceCommit,
                tag: "v" + lock.version
              },
              container: {
                repository,
                digest,
                immutableRef: repository + "@" + digest
              }
            }));
          '
          node scripts/generate-render-blueprint.mjs \
            --release-evidence /tmp/release-evidence.json \
            --out deployment/render.generated.yaml
          ruby -e '
            require "yaml"
            data = YAML.load_file("deployment/render.generated.yaml")
            services = data.fetch("services")
            abort "expected web and worker" unless services.map { |s| s["type"] }.sort == ["web", "worker"]
            web = services.find { |s| s["type"] == "web" }
            worker = services.find { |s| s["type"] == "worker" }
            abort "worker command missing" unless worker["dockerCommand"] == "npm run worker"
            abort "migration hook missing" unless web["preDeployCommand"] == "npm run db:migrate"
            abort "readiness health check missing" unless web["healthCheckPath"] == "/api/ready"
            abort "images differ" unless web.dig("image", "url") == worker.dig("image", "url")
            abort "image is not immutable" unless web.dig("image", "url").include?("@sha256:")
            db = data.fetch("databases").fetch(0)
            abort "database must block public access" unless db["ipAllowList"] == []
          '

      - name: Verify promotion evidence chain
        run: |
          node scripts/write-production-promotion-evidence.mjs \
            --release-evidence /tmp/release-evidence.json \
            --blueprint deployment/render.generated.yaml \
            --sig-commit bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb \
            --out /tmp/production-promotion-evidence.json
          node -e '
            const fs = require("fs");
            const crypto = require("crypto");
            const report = require("/tmp/production-promotion-evidence.json");
            const blueprint = fs.readFileSync("deployment/render.generated.yaml");
            const expected = crypto.createHash("sha256").update(blueprint).digest("hex");
            if (report.renderBlueprint.sha256 !== expected) process.exit(1);
            if (!report.engine.immutableImage.endsWith("@sha256:" + "a".repeat(64))) process.exit(1);
            if (report.sigCommit !== "b".repeat(40)) process.exit(1);
          '
          ruby -e 'require "yaml"; YAML.load_file(".github/workflows/prepare-production-promotion.yml")'
          grep -q 'releases/download/$ENGINE_TAG/release-evidence.json' .github/workflows/prepare-production-promotion.yml
          grep -q 'sig-production-promotion-' .github/workflows/prepare-production-promotion.yml

      - name: Verify acceptance review remains evidence-gated
        run: |
          node -e '
            const fs = require("fs");
            const lock = require("./engine.lock.json").engine;
            fs.writeFileSync("/tmp/live-deployment-smoke.json", JSON.stringify({
              schemaVersion: 1,
              application: "secure_innovation_gateway",
              baseUrl: "https://sig.example.test",
              checkedAt: new Date().toISOString(),
              engine: {
                version: lock.version,
                sourceCommit: lock.sourceCommit
              },
              checks: [
                { name: "engine_liveness", status: "pass" },
                { name: "engine_readiness", status: "pass" },
                { name: "public_intake_boundary", status: "pass" },
                { name: "participant_login_surface", status: "pass" },
                { name: "security_headers", status: "pass" }
              ],
              observedHeaders: {}
            }));
          '
          node scripts/assemble-acceptance-review.mjs \
            --promotion /tmp/production-promotion-evidence.json \
            --smoke /tmp/live-deployment-smoke.json \
            --promotion-run-id 12345 \
            --smoke-run-id 67890 \
            --deployment-id sig-ci-acceptance \
            --out-draft /tmp/acceptance-evidence-draft.json \
            --out-review /tmp/acceptance-review.json
          node -e '
            const review = require("/tmp/acceptance-review.json");
            const draft = require("/tmp/acceptance-evidence-draft.json");
            if (review.goLiveStatus !== "not_ready") process.exit(1);
            if (review.summary.passedGates !== 0) process.exit(1);
            if (review.summary.pendingGates !== review.summary.totalGates) process.exit(1);
            if (Object.values(draft.controls).some((control) => control.status !== "pending")) process.exit(1);
            if (!draft.controls.immutable_images.evidence.includes("Supporting evidence only")) process.exit(1);
          '
          ruby -e 'require "yaml"; YAML.load_file(".github/workflows/assemble-acceptance-review.yml")'
          grep -q 'actions/download-artifact@v4' .github/workflows/assemble-acceptance-review.yml
          grep -q 'Go-live status: \*\*not ready\*\*' .github/workflows/assemble-acceptance-review.yml

      - name: Verify final acceptance evidence review contract
        run: |
          node -e '
            const fs = require("fs");
            const draft = require("/tmp/acceptance-evidence-draft.json");
            const controls = {};
            for (const id of Object.keys(draft.controls)) {
              controls[id] = {
                status: "pass",
                evidence: "CI reviewer evidence reference for " + id
              };
            }
            fs.writeFileSync("/tmp/acceptance-review-decisions.json", JSON.stringify({
              schemaVersion: 1,
              deploymentId: draft.deploymentId,
              reviewedAt: new Date().toISOString(),
              reviewedBy: "CI reviewer",
              controls
            }));
          '
          node scripts/finalize-acceptance-evidence.mjs \
            --draft /tmp/acceptance-evidence-draft.json \
            --decisions /tmp/acceptance-review-decisions.json \
            --out /tmp/final-acceptance-evidence.json
          node -e '
            const final = require("/tmp/final-acceptance-evidence.json");
            if (Object.values(final.controls).some((control) => control.status !== "pass")) process.exit(1);
            if (Object.values(final.controls).some((control) => !control.evidence.includes("Reviewer evidence:"))) process.exit(1);
          '
          node -e '
            const fs = require("fs");
            const decisions = require("/tmp/acceptance-review-decisions.json");
            decisions.controls.immutable_images.evidence = "";
            fs.writeFileSync("/tmp/invalid-acceptance-decisions.json", JSON.stringify(decisions));
          '
          if node scripts/finalize-acceptance-evidence.mjs \
            --draft /tmp/acceptance-evidence-draft.json \
            --decisions /tmp/invalid-acceptance-decisions.json \
            --out /tmp/should-not-exist.json; then
            echo "Finalizer accepted a pass without reviewer evidence." >&2
            exit 1
          fi
          node --check scripts/finalize-acceptance-evidence.mjs

      - name: Verify live smoke harness contract
        run: |
          node --check scripts/verify-live-deployment.mjs
          if node scripts/verify-live-deployment.mjs --base-url http://example.invalid; then
            echo "Smoke harness accepted a non-HTTPS deployment URL." >&2
            exit 1
          fi
