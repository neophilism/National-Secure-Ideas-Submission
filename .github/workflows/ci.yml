name: Validate downstream application

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout downstream application
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify downstream policy guardrails
        run: node scripts/verify-policy.mjs

      - name: Checkout pinned engine source
        uses: actions/checkout@v4
        with:
          repository: neophilism/Secure-Intake-Case-Workflow-Engine
          ref: e7a79a84c7025a862473b21fc5f36a2c4e5673c9
          path: .engine

      - name: Install pinned engine dependencies
        working-directory: .engine
        run: npm install

      - name: Validate SIG manifest with pinned engine
        working-directory: .engine
        run: npm run app:manifest -- --file ../application/manifest.json --validate-only

      - name: Validate Compose configuration
        run: docker compose --env-file deployment/.env.example -f deployment/compose.yaml config

      - name: Verify production deployment acceptance template
        run: >-
          node scripts/verify-production-deployment.mjs
          --template
          --env deployment/production.env.example
          --evidence deployment/acceptance-evidence.example.json

      - name: Validate production Compose configuration
        run: >-
          docker compose
          --env-file deployment/production.env.example
          -f deployment/compose.production.yaml
          config

      - name: Generate and validate Render production Blueprint
        run: |
          node scripts/generate-render-blueprint.mjs \
            --engine-image ghcr.io/neophilism/secure-intake-case-workflow-engine@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            --out deployment/render.generated.yaml
          ruby -e '
            require "yaml"
            data = YAML.load_file("deployment/render.generated.yaml")
            services = data.fetch("services")
            abort "expected web and worker" unless services.map { |s| s["type"] }.sort == ["web", "worker"]
            web = services.find { |s| s["type"] == "web" }
            worker = services.find { |s| s["type"] == "worker" }
            abort "worker command missing" unless worker["dockerCommand"] == "npm run worker"
            abort "migration hook missing" unless web["preDeployCommand"] == "npm run db:migrate"
            abort "images differ" unless web.dig("image", "url") == worker.dig("image", "url")
            db = data.fetch("databases").fetch(0)
            abort "database must block public access" unless db["ipAllowList"] == []
          '
