services:
  postgres:
    image: ${POSTGRES_IMAGE:?Set POSTGRES_IMAGE to an immutable digest}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:?Set POSTGRES_USER} -d ${POSTGRES_DB:?Set POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - sig_postgres:/var/lib/postgresql/data
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  engine:
    image: ${ENGINE_IMAGE:?Set ENGINE_IMAGE to an immutable digest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:?Set POSTGRES_USER}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB}
      APP_BASE_URL: ${APP_BASE_URL:?Set APP_BASE_URL}
      AUTH_SESSION_COOKIE_NAME: ${AUTH_SESSION_COOKIE_NAME:?Set AUTH_SESSION_COOKIE_NAME}
      AUTH_SESSION_TTL_HOURS: ${AUTH_SESSION_TTL_HOURS:-8}
      PARTICIPANT_SESSION_COOKIE_NAME: ${PARTICIPANT_SESSION_COOKIE_NAME:?Set PARTICIPANT_SESSION_COOKIE_NAME}
      PARTICIPANT_SESSION_TTL_HOURS: ${PARTICIPANT_SESSION_TTL_HOURS:-8}
      AUTH_LOGIN_FAILURE_LIMIT: ${AUTH_LOGIN_FAILURE_LIMIT:-5}
      AUTH_LOGIN_WINDOW_MINUTES: ${AUTH_LOGIN_WINDOW_MINUTES:-15}
      AUTH_LOGIN_BLOCK_MINUTES: ${AUTH_LOGIN_BLOCK_MINUTES:-15}
      AUTH_TRUST_PROXY_HEADERS: ${AUTH_TRUST_PROXY_HEADERS:-true}
      DOCUMENT_STORAGE_DRIVER: local
      DOCUMENT_STORAGE_ROOT: /app/.data/documents
      DOCUMENT_MAX_BYTES: ${DOCUMENT_MAX_BYTES:-52428800}
      PUBLIC_UPLOAD_TOTAL_MAX_BYTES: ${PUBLIC_UPLOAD_TOTAL_MAX_BYTES:-52428800}
      PROTECTED_DATA_ENCRYPTION_KEY: ${PROTECTED_DATA_ENCRYPTION_KEY:?Set PROTECTED_DATA_ENCRYPTION_KEY}
      WEBHOOK_ENCRYPTION_KEY: ${WEBHOOK_ENCRYPTION_KEY:-}
      BACKGROUND_JOB_LEASE_SECONDS: ${BACKGROUND_JOB_LEASE_SECONDS:-60}
      BACKGROUND_JOB_POLL_MS: ${BACKGROUND_JOB_POLL_MS:-1000}
      BACKGROUND_JOB_BATCH_SIZE: ${BACKGROUND_JOB_BATCH_SIZE:-10}
      BACKGROUND_DEADLINE_SWEEP_SECONDS: ${BACKGROUND_DEADLINE_SWEEP_SECONDS:-60}
      API_DEFAULT_RATE_LIMIT_PER_MINUTE: ${API_DEFAULT_RATE_LIMIT_PER_MINUTE:-120}
    # The application is reachable only from a reverse proxy on this host.
    # TLS/WAF/MFA enforcement is an external deployment acceptance control.
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    volumes:
      - ../application:/application:ro
      - sig_documents:/app/.data/documents
    networks:
      - backend
      - egress
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512
    tmpfs:
      - /tmp
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  worker:
    image: ${ENGINE_IMAGE:?Set ENGINE_IMAGE to an immutable digest}
    command: ["npm", "run", "worker"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:?Set POSTGRES_USER}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB}
      APP_BASE_URL: ${APP_BASE_URL:?Set APP_BASE_URL}
      AUTH_SESSION_COOKIE_NAME: ${AUTH_SESSION_COOKIE_NAME:?Set AUTH_SESSION_COOKIE_NAME}
      PARTICIPANT_SESSION_COOKIE_NAME: ${PARTICIPANT_SESSION_COOKIE_NAME:?Set PARTICIPANT_SESSION_COOKIE_NAME}
      PARTICIPANT_SESSION_TTL_HOURS: ${PARTICIPANT_SESSION_TTL_HOURS:-8}
      DOCUMENT_STORAGE_DRIVER: local
      DOCUMENT_STORAGE_ROOT: /app/.data/documents
      PROTECTED_DATA_ENCRYPTION_KEY: ${PROTECTED_DATA_ENCRYPTION_KEY:?Set PROTECTED_DATA_ENCRYPTION_KEY}
      WEBHOOK_ENCRYPTION_KEY: ${WEBHOOK_ENCRYPTION_KEY:-}
      BACKGROUND_JOB_LEASE_SECONDS: ${BACKGROUND_JOB_LEASE_SECONDS:-60}
      BACKGROUND_JOB_POLL_MS: ${BACKGROUND_JOB_POLL_MS:-1000}
      BACKGROUND_JOB_BATCH_SIZE: ${BACKGROUND_JOB_BATCH_SIZE:-10}
      BACKGROUND_DEADLINE_SWEEP_SECONDS: ${BACKGROUND_DEADLINE_SWEEP_SECONDS:-60}
    volumes:
      - sig_documents:/app/.data/documents
    networks:
      - backend
      - egress
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512
    tmpfs:
      - /tmp
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

networks:
  backend:
    internal: true
  egress:

volumes:
  sig_postgres:
  sig_documents:
